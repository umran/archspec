# A resilient, horizontally scalable video streaming pipeline.
#
#   clients --upload complete--> ingest --VideoUploaded--> transcoder
#   transcoder --TranscodeCompleted--> catalog --VideoPublished--> notifier
#   clients --playback--> catalog
#
# Resilience: every state change is a keyed commit recovering its
# artifacts on retry; every event is identified; external boundaries
# declare their own deduplication; subscriptions are at-least-once with
# guaranteed completion. The transcoder branches on the engine's
# synchronous result: a rendered manifest completes the job, a rejected
# source fails it.
#
# Scalability: operations run unbounded; same-video work is serialized
# through the topic's video_id key and single-lane dispatch, while
# different videos proceed in parallel.
#
# Every obligation proves. The engine deduplicates renders by
# video_id, which fixes each video's one logical render and its
# terminal result; a rejected source is a terminal error, so a retried
# transcode observes the same terminal result and takes the same arm.
# Were the engine's error retryable — or its disposition undeclared —
# the retried match would not be established to replay, and the
# transcoder's idempotency, with the upload's cascade, would be
# unknown.
revision: 1
services:
  service.ingest:
    kind: backend
  service.transcoder:
    kind: worker
  service.catalog:
    kind: backend
  service.notifier:
    kind: worker
schemas:
  schema.UploadCompleteRequest:
    kind: canonical
    description: A client reports that an upload to the object store has finished.
    completeness: complete
    fields:
      upload_id: string
      video_id: uuid
      owner_id: uuid
      source_uri: string
      duration_ms: int
  schema.UploadCompleteResponse:
    kind: canonical
    completeness: complete
    fields:
      video_id: uuid
      status: string
  schema.PlaybackRequest:
    kind: canonical
    description: A viewer asks for a playable manifest.
    completeness: complete
    fields:
      video_id: uuid
      viewer_id: uuid
  schema.PlaybackResponse:
    kind: canonical
    completeness: complete
    fields:
      video_id: uuid
      status: string
      manifest_uri: string?
  schema.RequestRejected:
    kind: canonical
    description: The err payload of a request the boundary refused.
    completeness: complete
    fields:
      reason: string
  schema.RenderCompleted:
    kind: canonical
    description: The transcoding engine's ok payload.
    completeness: complete
    fields:
      manifest_uri: string
  schema.RenderFailed:
    kind: canonical
    description: The transcoding engine's err payload.
    completeness: complete
    fields:
      reason: string
  schema.VideoUploaded:
    kind: canonical
    description: A new source video is available for transcoding.
    completeness: complete
    fields:
      event_id: string
      video_id: uuid
      owner_id: uuid
      source_uri: string
  schema.TranscodeCompleted:
    kind: canonical
    description: All renditions of a video are ready behind one manifest.
    completeness: complete
    fields:
      event_id: string
      video_id: uuid
      manifest_uri: string
  schema.VideoPublished:
    kind: canonical
    description: A video is playable.
    completeness: complete
    fields:
      event_id: string
      video_id: uuid
      manifest_uri: string
  schema.VideoRecord:
    kind: canonical
    description: Catalog state of one video.
    completeness: complete
    fields:
      video_id: uuid
      owner_id: uuid
      source_uri: string
      status: string
      manifest_uri: string?
  schema.TranscodeJob:
    kind: canonical
    description: The transcoder's record of work for one video.
    completeness: complete
    fields:
      video_id: uuid
      source_uri: string
      status: string
      manifest_uri: string?
data_models:
  data.videos:
    objects:
      object.video:
        schema: schema.VideoRecord
        identity:
        - video_id
  data.transcoder:
    objects:
      object.job:
        schema: schema.TranscodeJob
        identity:
        - video_id
topics:
  topic.video_events:
    messages:
    - schema.TranscodeCompleted
    - schema.VideoPublished
    - schema.VideoUploaded
    ordering:
      kind: keyed
      mapping:
        schema.TranscodeCompleted: video_id
        schema.VideoPublished: video_id
        schema.VideoUploaded: video_id
    message_identity:
      kind: keyed
      mapping:
        schema.TranscodeCompleted:
        - event_id
        schema.VideoPublished:
        - event_id
        schema.VideoUploaded:
        - event_id
state_machines:
  machine.video_lifecycle:
    subject:
      kind: object
      object: object.video
      state: status
    states:
    - state.video.failed
    - state.video.ready
    - state.video.uploaded
    initial: state.video.uploaded
    transitions:
      transition.video.mark_failed:
        from:
        - state.video.uploaded
        to: state.video.failed
        side_effects: {}
      transition.video.mark_ready:
        from:
        - state.video.uploaded
        to: state.video.ready
        side_effects:
          effect.video.published:
            kind: publication
            topic: topic.video_events
            schema: schema.VideoPublished
            idempotency_key_propagation: []
  machine.job_lifecycle:
    subject:
      kind: object
      object: object.job
      state: status
    states:
    - state.job.done
    - state.job.failed
    - state.job.queued
    - state.job.running
    initial: state.job.queued
    transitions:
      transition.job.start:
        from:
        - state.job.queued
        to: state.job.running
        side_effects: {}
      transition.job.complete:
        from:
        - state.job.running
        to: state.job.done
        side_effects:
          effect.job.completed:
            kind: publication
            topic: topic.video_events
            schema: schema.TranscodeCompleted
            idempotency_key_propagation: []
      transition.job.fail:
        from:
        - state.job.running
        to: state.job.failed
        side_effects: {}
operations:
  operation.complete_upload:
    service: service.ingest
    description: Register an uploaded video and durably arrange the VideoUploaded announcement. Clients retry with the same upload_id.
    inputs:
      input.complete_upload.request:
        kind: request
        schema: schema.UploadCompleteRequest
        identity:
          kind: keyed
          fields:
          - upload_id
        result:
          ok: schema.UploadCompleteResponse
          err: schema.RequestRejected
    program:
      steps:
      - kind: transaction
        id: tx.complete_upload.register
        data_model: data.videos
        isolation: read_committed
        idempotency:
          kind: deduplicated_by
          key:
            components:
            - source: input:input.complete_upload.request
              path: upload_id
        steps:
        - kind: insert
          object: object.video
          values:
            kind: deterministic
            from:
            - source: input:input.complete_upload.request
              path: video_id
            - source: input:input.complete_upload.request
              path: owner_id
            - source: input:input.complete_upload.request
              path: source_uri
        - kind: establish_effect_intent
          bind: intent.complete_upload.publish_uploaded
          effect_id: effect.complete_upload.publish_uploaded
          effect:
            kind: publication
            topic: topic.video_events
            schema: schema.VideoUploaded
            idempotency_key_propagation:
            - source:
                components:
                - source: input:input.complete_upload.request
                  path: upload_id
              target:
                components:
                - source: effect:effect.complete_upload.publish_uploaded
                  path: event_id
          values:
            kind: deterministic
            from:
            - source: input:input.complete_upload.request
              path: upload_id
            - source: input:input.complete_upload.request
              path: video_id
            - source: input:input.complete_upload.request
              path: owner_id
            - source: input:input.complete_upload.request
              path: source_uri
        # status is the constant initial state, so the only provenance
        # root is the video id.
        - kind: establish_transaction_output
          bind: output.complete_upload
          schema: schema.UploadCompleteResponse
          values:
            kind: deterministic
            from:
            - source: input:input.complete_upload.request
              path: video_id
      - kind: execute_effect_intent
        intent: intent.complete_upload.publish_uploaded
      - kind: return
        request: input.complete_upload.request
        outcome:
          kind: ok
          values:
            kind: deterministic
            from:
            - source: transaction_output:output.complete_upload
              path: video_id
            - source: transaction_output:output.complete_upload
              path: status
    requirements:
      serialization: []
      ordering: []
      idempotency:
      - key:
          components:
          - source: input:input.complete_upload.request
            path: upload_id
        result: replay_consistent
      recoverability:
      - key:
          components:
          - source: input:input.complete_upload.request
            path: upload_id
        completion: resumable
    execution:
      concurrency:
        kind: unbounded
  operation.transcode_video:
    service: service.transcoder
    description: Claim the transcode job for an uploaded video and render its renditions through the transcoding engine; a rendered manifest completes the job, a rejected source fails it.
    inputs:
      input.transcode_video.uploaded:
        kind: subscription
        topic: topic.video_events
        messages:
          kind: only
          schemas:
          - schema.VideoUploaded
        delivery: at_least_once
        dispatch:
          routing: by_topic_key
          lane_concurrency:
            kind: bounded
            value: 1
    program:
      steps:
      - kind: transaction
        id: tx.transcode_video.claim
        data_model: data.transcoder
        isolation: read_committed
        idempotency:
          kind: deduplicated_by
          key:
            components:
            - source: input:input.transcode_video.uploaded
              path: event_id
        steps:
        - kind: insert
          object: object.job
          values:
            kind: deterministic
            from:
            - source: input:input.transcode_video.uploaded
              path: video_id
            - source: input:input.transcode_video.uploaded
              path: source_uri
        - kind: transition
          machine: machine.job_lifecycle
          transition: transition.job.start
          subject:
            object: object.job
            predicate:
              kind: eq
              field: video_id
              value:
                source: input:input.transcode_video.uploaded
                path: video_id
          effect_intents: {}
      - kind: execute_effect
        effect_id: effect.transcode_video.engine
        effect:
          kind: external
          name: transcoding-engine.render
          idempotency:
            kind: deduplicated_by
            key:
              components:
              - source: input:input.transcode_video.uploaded
                path: video_id
          result:
            ok: schema.RenderCompleted
            err:
              schema: schema.RenderFailed
              disposition: terminal
        values:
          kind: deterministic
          from:
          - source: input:input.transcode_video.uploaded
            path: video_id
          - source: input:input.transcode_video.uploaded
            path: source_uri
        bind: result.transcode_video.render
      - kind: match_result
        result: result.transcode_video.render
        ok:
          steps:
          - kind: transaction
            id: tx.transcode_video.complete
            data_model: data.transcoder
            isolation: read_committed
            idempotency:
              kind: deduplicated_by
              key:
                components:
                - source: input:input.transcode_video.uploaded
                  path: event_id
            steps:
            - kind: write
              target:
                object: object.job
                predicate:
                  kind: eq
                  field: video_id
                  value:
                    source: input:input.transcode_video.uploaded
                    path: video_id
              fields:
              - manifest_uri
              values:
                kind: deterministic
                from:
                - source: effect_result_ok:result.transcode_video.render
                  path: manifest_uri
            - kind: transition
              machine: machine.job_lifecycle
              transition: transition.job.complete
              subject:
                object: object.job
                predicate:
                  kind: eq
                  field: video_id
                  value:
                    source: input:input.transcode_video.uploaded
                    path: video_id
              effect_intents:
                effect.job.completed:
                  bind: intent.transcode_video.completed
                  values:
                    kind: deterministic
                    from:
                    - source: input:input.transcode_video.uploaded
                      path: event_id
                    - source: input:input.transcode_video.uploaded
                      path: video_id
                    - source: effect_result_ok:result.transcode_video.render
                      path: manifest_uri
          - kind: execute_effect_intent
            intent: intent.transcode_video.completed
          - kind: complete
        err:
          steps:
          - kind: transaction
            id: tx.transcode_video.fail
            data_model: data.transcoder
            isolation: read_committed
            idempotency:
              kind: deduplicated_by
              key:
                components:
                - source: input:input.transcode_video.uploaded
                  path: event_id
            steps:
            - kind: transition
              machine: machine.job_lifecycle
              transition: transition.job.fail
              subject:
                object: object.job
                predicate:
                  kind: eq
                  field: video_id
                  value:
                    source: input:input.transcode_video.uploaded
                    path: video_id
              effect_intents: {}
          - kind: complete
    requirements:
      serialization:
      - key:
          source: input:input.transcode_video.uploaded
          path: video_id
      ordering:
      - key:
          source: input:input.transcode_video.uploaded
          path: video_id
      idempotency:
      - key:
          components:
          - source: input:input.transcode_video.uploaded
            path: event_id
        result: unspecified
      recoverability:
      - key:
          components:
          - source: input:input.transcode_video.uploaded
            path: event_id
        completion: guaranteed
    execution:
      concurrency:
        kind: unbounded
  operation.publish_video:
    service: service.catalog
    description: Record the manifest and advance the video to ready, announcing VideoPublished.
    inputs:
      input.publish_video.completed:
        kind: subscription
        topic: topic.video_events
        messages:
          kind: only
          schemas:
          - schema.TranscodeCompleted
        delivery: at_least_once
        dispatch:
          routing: by_topic_key
          lane_concurrency:
            kind: bounded
            value: 1
    program:
      steps:
      - kind: transaction
        id: tx.publish_video.ready
        data_model: data.videos
        isolation: read_committed
        idempotency:
          kind: deduplicated_by
          key:
            components:
            - source: input:input.publish_video.completed
              path: event_id
        steps:
        - kind: write
          target:
            object: object.video
            predicate:
              kind: eq
              field: video_id
              value:
                source: input:input.publish_video.completed
                path: video_id
          fields:
          - manifest_uri
          values:
            kind: deterministic
            from:
            - source: input:input.publish_video.completed
              path: manifest_uri
        - kind: transition
          machine: machine.video_lifecycle
          transition: transition.video.mark_ready
          subject:
            object: object.video
            predicate:
              kind: eq
              field: video_id
              value:
                source: input:input.publish_video.completed
                path: video_id
          effect_intents:
            effect.video.published:
              bind: intent.publish_video.published
              values:
                kind: deterministic
                from:
                - source: input:input.publish_video.completed
                  path: event_id
                - source: input:input.publish_video.completed
                  path: video_id
                - source: input:input.publish_video.completed
                  path: manifest_uri
      - kind: execute_effect_intent
        intent: intent.publish_video.published
      - kind: complete
    requirements:
      serialization:
      - key:
          source: input:input.publish_video.completed
          path: video_id
      ordering:
      - key:
          source: input:input.publish_video.completed
          path: video_id
      idempotency:
      - key:
          components:
          - source: input:input.publish_video.completed
            path: event_id
        result: unspecified
      recoverability:
      - key:
          components:
          - source: input:input.publish_video.completed
            path: event_id
        completion: guaranteed
    execution:
      concurrency:
        kind: unbounded
  operation.notify_published:
    service: service.notifier
    description: Tell the owner their video is live, through a push gateway that deduplicates by notification id.
    inputs:
      input.notify_published.published:
        kind: subscription
        topic: topic.video_events
        messages:
          kind: only
          schemas:
          - schema.VideoPublished
        delivery: at_least_once
        dispatch:
          routing: by_topic_key
          lane_concurrency:
            kind: bounded
            value: 1
    program:
      steps:
      - kind: execute_effect
        effect_id: effect.notify_published.push
        effect:
          kind: external
          name: push-gateway.notify
          idempotency:
            kind: deduplicated_by
            key:
              components:
              - source: input:input.notify_published.published
                path: event_id
          result: null
        values:
          kind: deterministic
          from:
          - source: input:input.notify_published.published
            path: event_id
          - source: input:input.notify_published.published
            path: video_id
      - kind: complete
    requirements:
      serialization:
      - key:
          source: input:input.notify_published.published
          path: video_id
      ordering: []
      idempotency:
      - key:
          components:
          - source: input:input.notify_published.published
            path: event_id
        result: unspecified
      recoverability:
      - key:
          components:
          - source: input:input.notify_published.published
            path: event_id
        completion: guaranteed
    execution:
      concurrency:
        kind: unbounded
  operation.get_playback:
    service: service.catalog
    description: Resolve a playable manifest. Read-only, so repeating it is harmless; its result is deliberately not declared replay-consistent, because the video's state may legitimately change between attempts.
    inputs:
      input.get_playback.request:
        kind: request
        schema: schema.PlaybackRequest
        identity:
          kind: unspecified
        result:
          ok: schema.PlaybackResponse
          err: schema.RequestRejected
    program:
      steps:
      - kind: transaction
        id: tx.get_playback.read
        data_model: data.videos
        isolation: read_committed
        idempotency:
          kind: unspecified
        steps:
        - kind: read
          bind: read.get_playback.video
          target:
            object: object.video
            predicate:
              kind: eq
              field: video_id
              value:
                source: input:input.get_playback.request
                path: video_id
          fields:
            kind: only
            fields:
            - status
            - manifest_uri
        - kind: establish_transaction_output
          bind: output.get_playback
          schema: schema.PlaybackResponse
          values:
            kind: deterministic
            from:
            - source: input:input.get_playback.request
              path: video_id
            - source: transaction_read:read.get_playback.video
              path: status
            - source: transaction_read:read.get_playback.video
              path: manifest_uri
      - kind: return
        request: input.get_playback.request
        outcome:
          kind: ok
          values:
            kind: deterministic
            from:
            - source: transaction_output:output.get_playback
              path: video_id
            - source: transaction_output:output.get_playback
              path: status
            - source: transaction_output:output.get_playback
              path: manifest_uri
    requirements:
      serialization: []
      ordering: []
      idempotency:
      - key:
          components:
          - source: input:input.get_playback.request
            path: video_id
        result: unspecified
      recoverability: []
    execution:
      concurrency:
        kind: unbounded
