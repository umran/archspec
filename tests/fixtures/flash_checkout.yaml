    invocation_results: {}
    responses: {}
    transactions: {}
    flows:
      flow.charge_payment:
        steps:
        - kind: execute_effect
          effect: effect.charge_payment.card
          values:
            kind: unspecified
        - kind: execute_effect
          effect: effect.charge_payment.publish_captured
          values:
            kind: deterministic
            from:
            - source:
                kind: input
                id: input.charge_payment.reserved
              path:
              - event_id
            - source:
                kind: input
                id: input.charge_payment.reserved
              path:
              - order_id
            - source:
                kind: input
                id: input.charge_payment.reserved
              path:
              - amount
        response: null
    requirements:
      serialization:
      - key:
          source:
            kind: input
            id: input.charge_payment.reserved
          path:
          - order_id
      ordering:
      - key:
          source:
            kind: input
            id: input.charge_payment.reserved
          path:
          - order_id
      idempotency:
      - key:
          components:
          - source:
              kind: input
              id: input.charge_payment.reserved
            path:
            - event_id
        response: unspecified
      recoverability: []
    execution:
      concurrency:
        kind: unbounded
  operation.cancel_order:
    service: service.checkout
    description: Cancel a pending order and publish OrderCancelled.
    inputs:
      input.cancel_order.request:
        kind: request
        schema: schema.CancelOrderRequest
        identity:
          kind: unspecified
    effects:
      effect.cancel_order.publish_cancelled:
        kind: publication
        topic: topic.order_events
        schema: schema.OrderCancelled
        idempotency_key_propagation: []
    effect_intents:
      intent.cancel_order.publish_cancelled:
        effect: effect.cancel_order.publish_cancelled
    invocation_results: {}
    responses:
      response.cancel_order:
        request: input.cancel_order.request
        schema: schema.CancelOrderResponse
        source:
          kind: unspecified
    transactions:
      tx.cancel_order:
        data_model: data.checkout
