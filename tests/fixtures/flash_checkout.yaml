        optional: false
  schema.StockRecord:
    kind: canonical
    description: null
    completeness: complete
    fields:
      warehouse_id:
        ty:
          kind: scalar
          value: uuid
        optional: false
      sku:
        ty:
          kind: scalar
          value: string
        optional: false
      on_hand:
        ty:
          kind: scalar
          value: int
        optional: false
      reserved:
        ty:
          kind: scalar
          value: int
        optional: false
data_models:
  data.checkout:
    objects:
      object.order:
        schema: schema.OrderRecord
        identity:
        - - order_id
        requirements:
          history:
          - linearizable
  data.inventory:
    objects:
      object.stock:
        schema: schema.StockRecord
        identity:
        - - warehouse_id
        - - sku
        requirements:
          history:
          - linearizable
topics:
  topic.order_events:
    messages:
    - schema.InventoryReserved
    - schema.OrderCancelled
    - schema.OrderCreated
    - schema.OrderPaid
    - schema.PaymentCaptured
    ordering:
      kind: keyed
      mapping:
        schema.InventoryReserved:
        - order_id
        schema.OrderCancelled:
        - order_id
        schema.OrderCreated:
        - order_id
        schema.OrderPaid:
        - order_id
        schema.PaymentCaptured:
        - order_id
    message_identity:
      kind: keyed
      mapping:
        schema.InventoryReserved:
        - - event_id
        schema.OrderCancelled:
        - - event_id
        schema.OrderCreated:
        - - event_id
        schema.OrderPaid:
        - - event_id
        schema.PaymentCaptured:
        - - event_id
state_machines:
  machine.order_lifecycle:
    subject:
      kind: object
      object: object.order
      state:
      - status
    states:
    - state.order.cancelled
    - state.order.paid
    - state.order.pending
    initial: state.order.pending
    transitions:
      transition.order.cancel:
        from:
        - state.order.pending
        to: state.order.cancelled
        side_effects: {}
      transition.order.mark_paid:
        from:
        - state.order.pending
        to: state.order.paid
        side_effects:
          effect.order.paid:
            kind: publication
            topic: topic.order_events
            schema: schema.OrderPaid
            idempotency_key_propagation: []
operations:
  operation.create_order:
    service: service.checkout
    description: Create an order and durably arrange publication of OrderCreated.
    inputs:
      input.create_order.request:
        kind: request
        schema: schema.CreateOrderRequest
        identity:
          kind: keyed
          fields:
          - - idempotency_key
    effects:
      effect.create_order.publish_created:
        kind: publication
        topic: topic.order_events
        schema: schema.OrderCreated
        idempotency_key_propagation:
        - source:
            components:
            - source:
                kind: input
                id: input.create_order.request
              path:
              - idempotency_key
          target:
            components:
            - source:
                kind: effect
                id: effect.create_order.publish_created
              path:
              - event_id
    effect_intents:
      intent.create_order.publish_created:
        effect: effect.create_order.publish_created
    invocation_results:
      result.create_order:
        schema: schema.CreateOrderResponse
    responses:
      response.create_order:
        request: input.create_order.request
        schema: schema.CreateOrderResponse
        source:
          kind: invocation_result
          result: result.create_order
    transactions:
      tx.create_order.new:
        data_model: data.checkout
        isolation: read_committed
        idempotency:
          kind: deduplicated_by
          key:
            components:
            - source:
                kind: input
                id: input.create_order.request
              path:
              - idempotency_key
        steps:
        - kind: insert
          object: object.order
          values:
            kind: deterministic
            from:
            - source:
                kind: input
                id: input.create_order.request
              path:
              - order_id
            - source:
                kind: input
                id: input.create_order.request
              path:
              - amount
        - kind: establish_effect_intent
          intent: intent.create_order.publish_created
          values:
            kind: deterministic
            from:
            - source:
                kind: input
                id: input.create_order.request
              path:
              - order_id
            - source:
                kind: input
                id: input.create_order.request
              path:
              - idempotency_key
        - kind: establish_invocation_result
          result: result.create_order
          values:
            kind: deterministic
            from:
            - source:
                kind: input
                id: input.create_order.request
              path:
              - order_id
    flows:
      flow.create_order.new:
        steps:
        - kind: transaction
          transaction: tx.create_order.new
        - kind: execute_effect_intent
          intent: intent.create_order.publish_created
        response: response.create_order
    requirements:
      serialization: []
      ordering: []
      idempotency:
      - key:
          components:
          - source:
              kind: input
              id: input.create_order.request
            path:
            - idempotency_key
        response: replay_consistent
      recoverability:
      - key:
          components:
          - source:
              kind: input
              id: input.create_order.request
            path:
            - idempotency_key
        completion: resumable
    execution:
      concurrency:
        kind: unbounded
  operation.reserve_inventory:
    service: service.inventory
    description: Reserve stock for an OrderCreated event.
    inputs:
      input.reserve_inventory.created:
        kind: subscription
        topic: topic.order_events
        messages:
          kind: only
          schemas:
          - schema.OrderCreated
        delivery: at_least_once
        dispatch:
          routing: by_topic_key
          lane_concurrency:
            kind: bounded
            value: 1
    effects:
      effect.reserve_inventory.publish_reserved:
        kind: publication
        topic: topic.order_events
        schema: schema.InventoryReserved
        idempotency_key_propagation:
        - source:
            components:
            - source:
                kind: input
                id: input.reserve_inventory.created
              path:
              - event_id
          target:
            components:
            - source:
                kind: effect
                id: effect.reserve_inventory.publish_reserved
              path:
              - event_id
    effect_intents:
      intent.reserve_inventory.publish_reserved:
        effect: effect.reserve_inventory.publish_reserved
    invocation_results: {}
    responses: {}
    transactions:
      tx.reserve_inventory:
        data_model: data.inventory
        isolation: read_committed
        idempotency:
          kind: not_deduplicated
        steps:
        - kind: read
          result: read.reserve_inventory.stock
          target:
            object: object.stock
            predicate:
              kind: and
              predicates:
              - kind: eq
                field:
                - warehouse_id
                value:
                  kind: value
                  value:
                    source:
                      kind: input
                      id: input.reserve_inventory.created
                    path:
                    - warehouse_id
              - kind: eq
                field:
                - sku
                value:
                  kind: value
                  value:
                    source:
                      kind: input
                      id: input.reserve_inventory.created
                    path:
                    - sku
          fields:
            kind: only
            fields:
            - - on_hand
            - - reserved
        - kind: write
          target:
            object: object.stock
            predicate:
              kind: and
              predicates:
              - kind: eq
                field:
                - warehouse_id
                value:
                  kind: value
                  value:
                    source:
                      kind: input
                      id: input.reserve_inventory.created
                    path:
                    - warehouse_id
              - kind: eq
                field:
                - sku
                value:
                  kind: value
                  value:
                    source:
                      kind: input
                      id: input.reserve_inventory.created
                    path:
                    - sku
          fields:
          - - reserved
          values:
            kind: deterministic
            from:
            - source:
                kind: transaction_read
                id: read.reserve_inventory.stock
              path:
              - reserved
            - source:
                kind: input
                id: input.reserve_inventory.created
              path:
              - quantity
        - kind: establish_effect_intent
          intent: intent.reserve_inventory.publish_reserved
          values:
            kind: deterministic
            from:
            - source:
                kind: input
                id: input.reserve_inventory.created
              path:
              - order_id
            - source:
                kind: input
                id: input.reserve_inventory.created
              path:
              - event_id
    flows:
      flow.reserve_inventory:
        steps:
        - kind: transaction
          transaction: tx.reserve_inventory
        - kind: execute_effect_intent
          intent: intent.reserve_inventory.publish_reserved
        response: null
    requirements:
      serialization:
      - key:
          source:
            kind: input
            id: input.reserve_inventory.created
          path:
          - order_id
      ordering:
      - key:
          source:
            kind: input
            id: input.reserve_inventory.created
          path:
          - order_id
      idempotency:
      - key:
          components:
          - source:
              kind: input
              id: input.reserve_inventory.created
            path:
            - event_id
        response: unspecified
      recoverability:
      - key:
          components:
          - source:
              kind: input
              id: input.reserve_inventory.created
            path:
            - event_id
        completion: guaranteed
    execution:
      concurrency:
        kind: unbounded
  operation.charge_payment:
    service: service.payments
    description: Charge the card after inventory reservation.
