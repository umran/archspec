revision: 1
services:
  service.checkout:
    kind: backend
  service.inventory:
    kind: backend
  service.payments:
    kind: worker
schemas:
  schema.CreateOrderRequest:
    kind: canonical
    completeness: complete
    fields:
      idempotency_key: string
      order_id: uuid
      warehouse_id: uuid
      sku: string
      quantity: int
      amount: decimal
  schema.CreateOrderResponse:
    kind: canonical
    completeness: complete
    fields:
      order_id: uuid
      status: string
  schema.CancelOrderRequest:
    kind: canonical
    completeness: complete
    fields:
      order_id: uuid
  schema.CancelOrderResponse:
    kind: canonical
    completeness: complete
    fields:
      order_id: uuid
      status: string
  schema.TransferStockRequest:
    kind: canonical
    completeness: complete
    fields:
      source_warehouse_id: uuid
      destination_warehouse_id: uuid
      sku: string
      quantity: int
  schema.TransferStockResponse:
    kind: canonical
    completeness: complete
    fields:
      accepted: bool
  schema.OrderCreated:
    kind: canonical
    completeness: complete
    fields:
      event_id: string
      order_id: uuid
      warehouse_id: uuid
      sku: string
      quantity: int
      amount: decimal
  schema.InventoryReserved:
    kind: canonical
    completeness: complete
    fields:
      event_id: string
      order_id: uuid
      warehouse_id: uuid
      sku: string
      quantity: int
      amount: decimal
  schema.PaymentCaptured:
    kind: canonical
    completeness: complete
    fields:
      event_id: string
      order_id: uuid
      amount: decimal
  schema.OrderCancelled:
    kind: canonical
    completeness: complete
    fields:
      event_id: string
      order_id: uuid
  schema.OrderPaid:
    kind: canonical
    completeness: complete
    fields:
      event_id: string
      order_id: uuid
  schema.OrderRecord:
    kind: canonical
    completeness: complete
    fields:
      order_id: uuid
      status: string
      amount: decimal
  schema.StockRecord:
    kind: canonical
    completeness: complete
    fields:
      warehouse_id: uuid
      sku: string
      on_hand: int
      reserved: int
data_models:
  data.checkout:
    objects:
      object.order:
        schema: schema.OrderRecord
        identity:
        - order_id
        requirements:
          history:
          - linearizable
  data.inventory:
    objects:
      object.stock:
        schema: schema.StockRecord
        identity:
        - warehouse_id
        - sku
        requirements:
          history:
          - linearizable
topics:
  topic.order_events:
    messages:
    - schema.InventoryReserved
    - schema.OrderCancelled
    - schema.OrderCreated
    - schema.OrderPaid
    - schema.PaymentCaptured
    ordering:
      kind: keyed
      mapping:
        schema.InventoryReserved: order_id
        schema.OrderCancelled: order_id
        schema.OrderCreated: order_id
        schema.OrderPaid: order_id
        schema.PaymentCaptured: order_id
    message_identity:
      kind: keyed
      mapping:
        schema.InventoryReserved:
        - event_id
        schema.OrderCancelled:
        - event_id
        schema.OrderCreated:
        - event_id
        schema.OrderPaid:
        - event_id
        schema.PaymentCaptured:
        - event_id
state_machines:
  machine.order_lifecycle:
    subject:
      kind: object
      object: object.order
      state: status
    states:
    - state.order.cancelled
    - state.order.paid
    - state.order.pending
    initial: state.order.pending
    transitions:
      transition.order.cancel:
        from:
        - state.order.pending
        to: state.order.cancelled
        side_effects: {}
      transition.order.mark_paid:
        from:
        - state.order.pending
        to: state.order.paid
        side_effects:
          effect.order.paid:
            kind: publication
            topic: topic.order_events
            schema: schema.OrderPaid
            idempotency_key_propagation: []
operations:
  operation.create_order:
    service: service.checkout
    description: Create an order and durably arrange publication of OrderCreated.
    inputs:
      input.create_order.request:
        kind: request
        schema: schema.CreateOrderRequest
        identity:
          kind: keyed
          fields:
          - idempotency_key
    effects:
      effect.create_order.publish_created:
        kind: publication
        topic: topic.order_events
        schema: schema.OrderCreated
        idempotency_key_propagation:
        - source:
            components:
            - source: input:input.create_order.request
              path: idempotency_key
          target:
            components:
            - source: effect:effect.create_order.publish_created
              path: event_id
    effect_intents:
      intent.create_order.publish_created:
        effect: effect.create_order.publish_created
    invocation_results:
      result.create_order:
        schema: schema.CreateOrderResponse
    responses:
      response.create_order:
        request: input.create_order.request
        schema: schema.CreateOrderResponse
        source:
          kind: invocation_result
          result: result.create_order
    transactions:
      tx.create_order.new:
        data_model: data.checkout
        isolation: read_committed
        idempotency:
          kind: deduplicated_by
          key:
            components:
            - source: input:input.create_order.request
              path: idempotency_key
        steps:
        - kind: insert
          object: object.order
          values:
            kind: deterministic
            from:
            - source: input:input.create_order.request
              path: order_id
            - source: input:input.create_order.request
              path: amount
        - kind: establish_effect_intent
          intent: intent.create_order.publish_created
          values:
            kind: deterministic
            from:
            - source: input:input.create_order.request
              path: order_id
            - source: input:input.create_order.request
              path: idempotency_key
        - kind: establish_invocation_result
          result: result.create_order
          values:
            kind: deterministic
            from:
            - source: input:input.create_order.request
              path: order_id
    flows:
      flow.create_order.new:
        steps:
        - kind: transaction
          transaction: tx.create_order.new
        - kind: execute_effect_intent
          intent: intent.create_order.publish_created
        response: response.create_order
    requirements:
      serialization: []
      ordering: []
      idempotency:
      - key:
          components:
          - source: input:input.create_order.request
            path: idempotency_key
        response: replay_consistent
      recoverability:
      - key:
          components:
          - source: input:input.create_order.request
            path: idempotency_key
        completion: resumable
    execution:
      concurrency:
        kind: unbounded
  operation.reserve_inventory:
    service: service.inventory
    description: Reserve stock for an OrderCreated event.
    inputs:
      input.reserve_inventory.created:
        kind: subscription
        topic: topic.order_events
        messages:
          kind: only
          schemas:
          - schema.OrderCreated
        delivery: at_least_once
        dispatch:
          routing: by_topic_key
          lane_concurrency:
            kind: bounded
            value: 1
    effects:
      effect.reserve_inventory.publish_reserved:
        kind: publication
        topic: topic.order_events
        schema: schema.InventoryReserved
        idempotency_key_propagation:
        - source:
            components:
            - source: input:input.reserve_inventory.created
              path: event_id
          target:
            components:
            - source: effect:effect.reserve_inventory.publish_reserved
              path: event_id
    effect_intents:
      intent.reserve_inventory.publish_reserved:
        effect: effect.reserve_inventory.publish_reserved
    invocation_results: {}
    responses: {}
    transactions:
      tx.reserve_inventory:
        data_model: data.inventory
        isolation: read_committed
        idempotency:
          kind: not_deduplicated
        steps:
        - kind: read
          result: read.reserve_inventory.stock
          target:
            object: object.stock
            predicate:
              kind: and
              predicates:
              - kind: eq
                field: warehouse_id
                value:
                  source: input:input.reserve_inventory.created
                  path: warehouse_id
              - kind: eq
                field: sku
                value:
                  source: input:input.reserve_inventory.created
                  path: sku
          fields:
            kind: only
            fields:
            - on_hand
            - reserved
        - kind: write
          target:
            object: object.stock
            predicate:
              kind: and
              predicates:
              - kind: eq
                field: warehouse_id
                value:
                  source: input:input.reserve_inventory.created
                  path: warehouse_id
              - kind: eq
                field: sku
                value:
                  source: input:input.reserve_inventory.created
                  path: sku
          fields:
          - reserved
          values:
            kind: deterministic
            from:
            - source: transaction_read:read.reserve_inventory.stock
              path: reserved
            - source: input:input.reserve_inventory.created
              path: quantity
        - kind: establish_effect_intent
          intent: intent.reserve_inventory.publish_reserved
          values:
            kind: deterministic
            from:
            - source: input:input.reserve_inventory.created
              path: order_id
            - source: input:input.reserve_inventory.created
              path: event_id
    flows:
      flow.reserve_inventory:
        steps:
        - kind: transaction
          transaction: tx.reserve_inventory
        - kind: execute_effect_intent
          intent: intent.reserve_inventory.publish_reserved
        response: null
    requirements:
      serialization:
      - key:
          source: input:input.reserve_inventory.created
          path: order_id
      ordering:
      - key:
          source: input:input.reserve_inventory.created
          path: order_id
      idempotency:
      - key:
          components:
          - source: input:input.reserve_inventory.created
            path: event_id
        response: unspecified
      recoverability:
      - key:
          components:
          - source: input:input.reserve_inventory.created
            path: event_id
        completion: guaranteed
    execution:
      concurrency:
        kind: unbounded
  operation.charge_payment:
    service: service.payments
    description: Charge the card after inventory reservation.
    inputs:
      input.charge_payment.reserved:
        kind: subscription
        topic: topic.order_events
        messages:
          kind: only
          schemas:
          - schema.InventoryReserved
        delivery: at_least_once
        dispatch:
          routing: by_topic_key
          lane_concurrency:
            kind: bounded
            value: 1
    effects:
      effect.charge_payment.card:
        kind: external
        name: payment-provider.charge
        idempotency:
          kind: not_deduplicated
      effect.charge_payment.publish_captured:
        kind: publication
        topic: topic.order_events
        schema: schema.PaymentCaptured
        idempotency_key_propagation:
        - source:
            components:
            - source: input:input.charge_payment.reserved
              path: event_id
          target:
            components:
            - source: effect:effect.charge_payment.publish_captured
              path: event_id
    effect_intents: {}
    invocation_results: {}
    responses: {}
    transactions: {}
    flows:
      flow.charge_payment:
        steps:
        - kind: execute_effect
          effect: effect.charge_payment.card
          values:
            kind: unspecified
        - kind: execute_effect
          effect: effect.charge_payment.publish_captured
          values:
            kind: deterministic
            from:
            - source: input:input.charge_payment.reserved
              path: event_id
            - source: input:input.charge_payment.reserved
              path: order_id
            - source: input:input.charge_payment.reserved
              path: amount
        response: null
    requirements:
      serialization:
      - key:
          source: input:input.charge_payment.reserved
          path: order_id
      ordering:
      - key:
          source: input:input.charge_payment.reserved
          path: order_id
      idempotency:
      - key:
          components:
          - source: input:input.charge_payment.reserved
            path: event_id
        response: unspecified
      recoverability: []
    execution:
      concurrency:
        kind: unbounded
  operation.cancel_order:
    service: service.checkout
    description: Cancel a pending order and publish OrderCancelled.
    inputs:
      input.cancel_order.request:
        kind: request
        schema: schema.CancelOrderRequest
        identity:
          kind: unspecified
    effects:
      effect.cancel_order.publish_cancelled:
        kind: publication
        topic: topic.order_events
        schema: schema.OrderCancelled
        idempotency_key_propagation: []
    effect_intents:
      intent.cancel_order.publish_cancelled:
        effect: effect.cancel_order.publish_cancelled
    invocation_results: {}
    responses:
      response.cancel_order:
        request: input.cancel_order.request
        schema: schema.CancelOrderResponse
        source:
          kind: unspecified
    transactions:
      tx.cancel_order:
        data_model: data.checkout
        isolation: read_committed
        idempotency:
          kind: deduplicated_by
          key:
            components:
            - source: input:input.cancel_order.request
              path: order_id
        steps:
        - kind: transition
          machine: machine.order_lifecycle
          transition: transition.order.cancel
          subject:
            object: object.order
            predicate:
              kind: eq
              field: order_id
              value:
                source: input:input.cancel_order.request
                path: order_id
          effect_values: {}
        - kind: establish_effect_intent
          intent: intent.cancel_order.publish_cancelled
          values:
            kind: deterministic
            from:
            - source: input:input.cancel_order.request
              path: order_id
    flows:
      flow.cancel_order:
        steps:
        - kind: transaction
          transaction: tx.cancel_order
        - kind: execute_effect_intent
          intent: intent.cancel_order.publish_cancelled
        response: response.cancel_order
    requirements:
      serialization: []
      ordering: []
      idempotency: []
      recoverability: []
    execution:
      concurrency:
        kind: unbounded
  operation.apply_payment:
    service: service.checkout
    description: Advance a pending order to paid on PaymentCaptured.
    inputs:
      input.apply_payment.captured:
        kind: subscription
        topic: topic.order_events
        messages:
          kind: only
          schemas:
          - schema.PaymentCaptured
        delivery: at_least_once
        dispatch:
          routing: by_topic_key
          lane_concurrency:
            kind: bounded
            value: 1
    effects: {}
    effect_intents:
      intent.apply_payment.order_paid:
        effect: effect.order.paid
    invocation_results: {}
    responses: {}
    transactions:
      tx.apply_payment:
        data_model: data.checkout
        isolation: read_committed
        idempotency:
          kind: deduplicated_by
          key:
            components:
            - source: input:input.apply_payment.captured
              path: event_id
        steps:
        - kind: read
          result: read.apply_payment.order
          target:
            object: object.order
            predicate:
              kind: eq
              field: order_id
              value:
                source: input:input.apply_payment.captured
                path: order_id
          fields:
            kind: only
            fields:
            - order_id
        - kind: transition
          machine: machine.order_lifecycle
          transition: transition.order.mark_paid
          subject:
            object: object.order
            predicate:
              kind: eq
              field: order_id
              value:
                source: input:input.apply_payment.captured
                path: order_id
          effect_values:
            effect.order.paid:
              kind: deterministic
              from:
              - source: transaction_read:read.apply_payment.order
                path: order_id
              - source: input:input.apply_payment.captured
                path: event_id
    flows:
      flow.apply_payment:
        steps:
        - kind: transaction
          transaction: tx.apply_payment
        - kind: execute_effect_intent
          intent: intent.apply_payment.order_paid
        response: null
    requirements:
      serialization:
      - key:
          source: input:input.apply_payment.captured
          path: order_id
      ordering:
      - key:
          source: input:input.apply_payment.captured
          path: order_id
      idempotency:
      - key:
          components:
          - source: input:input.apply_payment.captured
            path: event_id
        response: unspecified
      recoverability:
      - key:
          components:
          - source: input:input.apply_payment.captured
            path: event_id
        completion: guaranteed
    execution:
      concurrency:
        kind: unbounded
  operation.transfer_stock:
    service: service.inventory
    description: Move stock between warehouses.
    inputs:
      input.transfer_stock.request:
        kind: request
        schema: schema.TransferStockRequest
        identity:
          kind: unspecified
    effects: {}
    effect_intents: {}
    invocation_results: {}
    responses:
      response.transfer_stock:
        request: input.transfer_stock.request
        schema: schema.TransferStockResponse
        source:
          kind: unspecified
    transactions:
      tx.transfer_stock:
        data_model: data.inventory
        isolation: read_committed
        idempotency:
          kind: unspecified
        steps:
        # The two exclusive locks below take the source and destination
        # rows as separate steps in program order with no acquisition
        # order between them, so a concurrent transfer in the opposite
        # direction may deadlock. The DSL cannot yet say otherwise and
        # no checker yet looks (ARCHSPEC_SEMANTICS_REVISION_DRAFT.md §27,
        # questions 8 and 9).
        - kind: lock
          target:
            object: object.stock
            predicate:
              kind: and
              predicates:
              - kind: eq
                field: warehouse_id
                value:
                  source: input:input.transfer_stock.request
                  path: source_warehouse_id
              - kind: eq
                field: sku
                value:
                  source: input:input.transfer_stock.request
                  path: sku
          mode: exclusive
          order:
            kind: unspecified
        - kind: lock
          target:
            object: object.stock
            predicate:
              kind: and
              predicates:
              - kind: eq
                field: warehouse_id
                value:
                  source: input:input.transfer_stock.request
                  path: destination_warehouse_id
              - kind: eq
                field: sku
                value:
                  source: input:input.transfer_stock.request
                  path: sku
          mode: exclusive
          order:
            kind: unspecified
        - kind: read
          result: read.transfer_stock.source_stock
          target:
            object: object.stock
            predicate:
              kind: and
              predicates:
              - kind: eq
                field: warehouse_id
                value:
                  source: input:input.transfer_stock.request
                  path: source_warehouse_id
              - kind: eq
                field: sku
                value:
                  source: input:input.transfer_stock.request
                  path: sku
          fields:
            kind: only
            fields:
            - on_hand
        - kind: write
          target:
            object: object.stock
            predicate:
              kind: and
              predicates:
              - kind: eq
                field: warehouse_id
                value:
                  source: input:input.transfer_stock.request
                  path: source_warehouse_id
              - kind: eq
                field: sku
                value:
                  source: input:input.transfer_stock.request
                  path: sku
          fields:
          - on_hand
          values:
            kind: deterministic
            from:
            - source: transaction_read:read.transfer_stock.source_stock
              path: on_hand
            - source: input:input.transfer_stock.request
              path: quantity
        - kind: write
          target:
            object: object.stock
            predicate:
              kind: and
              predicates:
              - kind: eq
                field: warehouse_id
                value:
                  source: input:input.transfer_stock.request
                  path: destination_warehouse_id
              - kind: eq
                field: sku
                value:
                  source: input:input.transfer_stock.request
                  path: sku
          fields:
          - on_hand
          values:
            kind: unspecified
    flows:
      flow.transfer_stock:
        steps:
        - kind: transaction
          transaction: tx.transfer_stock
        response: response.transfer_stock
    requirements:
      serialization: []
      ordering: []
      idempotency: []
      recoverability: []
    execution:
      concurrency:
        kind: unbounded
