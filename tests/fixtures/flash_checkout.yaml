            components:
            - source:
                kind: input
                id: input.cancel_order.request
              path:
              - order_id
        steps:
        - kind: transition
          machine: machine.order_lifecycle
          transition: transition.order.cancel
          subject:
            object: object.order
            predicate:
              kind: eq
              field:
              - order_id
              value:
                kind: value
                value:
                  source:
                    kind: input
                    id: input.cancel_order.request
                  path:
                  - order_id
          effect_values: {}
        - kind: establish_effect_intent
          intent: intent.cancel_order.publish_cancelled
          values:
            kind: deterministic
            from:
            - source:
                kind: input
                id: input.cancel_order.request
              path:
              - order_id
    flows:
      flow.cancel_order:
        steps:
        - kind: transaction
          transaction: tx.cancel_order
        - kind: execute_effect_intent
          intent: intent.cancel_order.publish_cancelled
        response: response.cancel_order
    requirements:
      serialization: []
      ordering: []
      idempotency: []
      recoverability: []
