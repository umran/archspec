revision: 1
services:
  service.checkout:
    kind: backend
  service.inventory:
    kind: backend
  service.payments:
    kind: worker
schemas:
  schema.CreateOrderRequest:
    kind: canonical
    description: null
    completeness: complete
    fields:
      idempotency_key:
        ty:
          kind: scalar
          value: string
        optional: false
      order_id:
        ty:
          kind: scalar
          value: uuid
        optional: false
      warehouse_id:
        ty:
          kind: scalar
          value: uuid
        optional: false
      sku:
        ty:
          kind: scalar
          value: string
        optional: false
      quantity:
        ty:
          kind: scalar
          value: int
        optional: false
      amount:
        ty:
          kind: scalar
          value: decimal
        optional: false
  schema.CreateOrderResponse:
    kind: canonical
    description: null
    completeness: complete
    fields:
      order_id:
        ty:
          kind: scalar
          value: uuid
        optional: false
      status:
        ty:
          kind: scalar
          value: string
        optional: false
  schema.CancelOrderRequest:
    kind: canonical
    description: null
    completeness: complete
    fields:
      order_id:
        ty:
          kind: scalar
          value: uuid
        optional: false
  schema.CancelOrderResponse:
    kind: canonical
    description: null
    completeness: complete
    fields:
      order_id:
        ty:
          kind: scalar
          value: uuid
        optional: false
      status:
        ty:
          kind: scalar
          value: string
        optional: false
  schema.TransferStockRequest:
    kind: canonical
    description: null
    completeness: complete
    fields:
      source_warehouse_id:
        ty:
          kind: scalar
          value: uuid
        optional: false
      destination_warehouse_id:
        ty:
          kind: scalar
          value: uuid
        optional: false
      sku:
        ty:
          kind: scalar
          value: string
        optional: false
      quantity:
        ty:
          kind: scalar
          value: int
        optional: false
  schema.TransferStockResponse:
    kind: canonical
    description: null
    completeness: complete
    fields:
      accepted:
        ty:
          kind: scalar
          value: bool
        optional: false
  schema.OrderCreated:
    kind: canonical
    description: null
    completeness: complete
    fields:
      event_id:
        ty:
          kind: scalar
          value: string
        optional: false
      order_id:
        ty:
          kind: scalar
          value: uuid
        optional: false
      warehouse_id:
        ty:
          kind: scalar
          value: uuid
        optional: false
      sku:
        ty:
          kind: scalar
          value: string
        optional: false
      quantity:
        ty:
          kind: scalar
          value: int
        optional: false
      amount:
        ty:
          kind: scalar
          value: decimal
        optional: false
  schema.InventoryReserved:
    kind: canonical
    description: null
    completeness: complete
    fields:
      event_id:
        ty:
          kind: scalar
          value: string
        optional: false
      order_id:
        ty:
          kind: scalar
          value: uuid
        optional: false
      warehouse_id:
        ty:
          kind: scalar
          value: uuid
        optional: false
      sku:
        ty:
          kind: scalar
          value: string
        optional: false
      quantity:
        ty:
          kind: scalar
          value: int
        optional: false
      amount:
        ty:
          kind: scalar
          value: decimal
        optional: false
  schema.PaymentCaptured:
    kind: canonical
    description: null
    completeness: complete
    fields:
      event_id:
        ty:
          kind: scalar
          value: string
        optional: false
      order_id:
        ty:
          kind: scalar
          value: uuid
        optional: false
      amount:
        ty:
          kind: scalar
          value: decimal
        optional: false
  schema.OrderCancelled:
    kind: canonical
    description: null
    completeness: complete
    fields:
      event_id:
        ty:
          kind: scalar
          value: string
        optional: false
      order_id:
        ty:
          kind: scalar
          value: uuid
        optional: false
  schema.OrderPaid:
    kind: canonical
    description: null
    completeness: complete
    fields:
      event_id:
        ty:
          kind: scalar
          value: string
        optional: false
      order_id:
        ty:
          kind: scalar
          value: uuid
        optional: false
  schema.OrderRecord:
    kind: canonical
    description: null
    completeness: complete
    fields:
      order_id:
        ty:
          kind: scalar
          value: uuid
        optional: false
      status:
        ty:
          kind: scalar
          value: string
        optional: false
