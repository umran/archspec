revision: 2

services:
    checkout:
        kind: backend

    payments:
        kind: worker

schemas:
    OrderEvent:
        kind: canonical
        description: A lifecycle event associated with an order.
        completeness: complete
        fields:
            order_id: uuid
            event_id: uuid
            event_type: string

    OrderIdentity:
        kind: fragment
        source: OrderEvent
        mapping:
            order_id: order_id

data_models: {}

topics:
    order_events:
        messages:
            - OrderEvent

        ordering:
            kind: keyed
            mapping:
                OrderEvent: order_id

        message_identity:
            kind: keyed
            mapping:
                OrderEvent:
                    - event_id

state_machines: {}

operations: {}
